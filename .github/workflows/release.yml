name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 0.1.0
        required: true
        type: string

env:
  VERSION: ${{ inputs.version }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$VERSION is not a semantic version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/copperscript-$VERSION" >/dev/null; then
            echo "::error::the tag copperscript-$VERSION already exists"
            exit 1
          fi

  build:
    needs: check
    strategy:
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: copperscript.exe
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: copperscript
          - platform: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            binary: copperscript
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: copperscript
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test
        if: matrix.platform != 'macos-x86_64'
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} -p copperscript_filter
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: copperscript/bin
      - name: Commit the binaries and push the tag
        run: |
          chmod +x copperscript/bin/{macos-aarch64,macos-x86_64,linux-x86_64}/copperscript
          ls -lR copperscript/bin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          git add -f copperscript/bin
          git commit -m "copperscript $VERSION"
          git tag "copperscript-$VERSION"
          git push origin "refs/tags/copperscript-$VERSION"
