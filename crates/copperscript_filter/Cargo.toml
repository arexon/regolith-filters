[package]
name = "copperscript_filter"
description = "Regolith filter that builds a Copperscript plugin into a behavior pack"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "copperscript"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v5"] }

[lints]
workspace = true
